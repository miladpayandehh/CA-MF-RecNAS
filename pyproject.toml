[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-mf-recnas"
version = "0.1.0"
description = "Cost-aware multi-fidelity neural architecture search for recommender systems"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Milad Payandeh"},
  {name = "Mahdi bahremand"},
]
dependencies = [
  "numpy>=1.24,<3.0",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "tqdm>=4.65",
  "requests>=2.31",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
camf-recnas = "camf_recnas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
